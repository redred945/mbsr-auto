<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 86" role="img" aria-label="MBSR Auto">
  <defs>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b3001e"/>
      <stop offset=".55" stop-color="#e4002b"/>
      <stop offset="1" stop-color="#ff3346"/>
    </linearGradient>
  </defs>
  <!-- bold diagonal speed slash cutting through the wordmark -->
  <g transform="rotate(-13 125 55)">
    <rect x="2" y="49" width="210" height="15" rx="2" fill="url(#slash)"/>
    <rect x="216" y="49" width="14" height="15" rx="2" fill="url(#slash)" opacity=".7"/>
    <rect x="234" y="49" width="7" height="15" rx="2" fill="url(#slash)" opacity=".4"/>
  </g>
  <!-- wordmark -->
  <text x="2" y="52" font-family="'Arial Black',Arial,sans-serif" font-weight="900"
        font-style="italic" font-size="52" letter-spacing="0" fill="#ffffff"
        transform="skewX(-8)">MBSR</text>
  <text x="150" y="80" font-family="Arial,Helvetica,sans-serif" font-weight="800"
        font-size="17" letter-spacing="7" fill="#d2d5dc" transform="skewX(-8)">AUTO</text>
</svg>
